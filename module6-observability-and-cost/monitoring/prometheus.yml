# monitoring/prometheus.yml — laptop scrape targets (Lambda vLLM via SSH tunnel).
# Linux Docker: docker-compose sets extra_hosts host.docker.internal.
#
# Every job carries `topology` and `layer` so the three layers can be joined on one panel
# (the concurrency funnel: lb -> gateway -> engine).
#
# `server_profile` on the engine job is the A/B key. vLLM does not emit it, so it is
# attached here at scrape time. Change it when you switch engine flags, then:
#   curl -X POST http://127.0.0.1:9090/-/reload
# (--web.enable-lifecycle is already set in docker-compose.yml)

global:
  # 5s, not 15s: benchmark runs are often under a minute and queue-depth spikes last
  # seconds. At 15s you sample a burst once or twice and the graph lies.
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  # nginx load balancer, via nginx-prometheus-exporter reading stub_status on host :8081
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          topology: single_gpu_gateway
          layer: lb

  # FastAPI gateway: /metrics on GATEWAY_METRICS_PORT (default 9101), opened at startup
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels:
          topology: single_gpu_gateway
          layer: gateway
    metrics_path: /metrics

  # vLLM on laptop 127.0.0.1:8000 via SSH tunnel (Prometheus in Docker -> host.docker.internal).
  # Same port as the OpenAI API.
  - job_name: vllm_tunnel
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          topology: single_gpu_gateway
          layer: engine
          server_profile: baseline
    metrics_path: /metrics
